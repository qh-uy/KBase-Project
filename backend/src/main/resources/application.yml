spring:
  application:
    name: KBase
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 510MB

  # Mail
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# Actuator (Health Check)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# App Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForKBaseApplicationThatShouldBeAtLeast256BitsLong}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}        # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 days

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:kbase-bucket}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  upload:
    max-file-size-mb: 500
    allowed-document-types: pdf,doc,docx,xls,xlsx,ppt,pptx,md,txt
    allowed-image-types: jpg,jpeg,png,gif,svg,bmp,webp
    allowed-video-types: mp4,mov,avi,webm
