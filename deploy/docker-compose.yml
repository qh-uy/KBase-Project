services:
  # ─────────────────────────────────────────────
  # SQL Server 2022
  # ─────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kbase_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sa@12345"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Sa@12345", "-Q", "SELECT 1", "-No" ]
      interval: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kbase_network

  # ─────────────────────────────────────────────
  # MinIO — Object Storage (S3-compatible)
  # ─────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: kbase_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - kbase_network

  # ─────────────────────────────────────────────
  # MailHog — Test Email (SMTP fake server)
  # ─────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: kbase_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped
    networks:
      - kbase_network

volumes:
  sqlserver_data:
  minio_data:

networks:
  kbase_network:
    driver: bridge
